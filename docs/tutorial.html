<header><a class="wordmark" href="#"><span>✳</span> Stellar Secretary <small>交互教程</small></a><div><select id="tutorial-language" aria-label="显示语言"><option value="zh">简体中文</option><option value="en">English</option></select><button id="reset" class="quiet">重新练习</button><a id="return-app" class="quiet" href="/">返回知识秘书 ↗</a></div></header>
<main>
<section class="intro"><div><p class="eyebrow">从存下第一份资料开始</p><h1>动手试一次，就会用了。</h1><p>六个小练习，熟悉从归档到找回资料的完整流程。</p></div><span class="safe">示例练习 · 不写入知识库 · 不调用模型</span></section>
<div class="course">
<nav id="steps" aria-label="教程步骤"></nav>
<section class="lesson" aria-labelledby="lesson-title">
<div class="lesson-head"><p id="step-number" class="eyebrow"></p><h2 id="lesson-title"></h2><p id="instruction"></p><p id="hint" class="hint"></p></div>
<div class="sandbox" aria-label="知识秘书练习界面">

<div class="workspace"><div class="workspace-head"><strong>Stellar Secretary</strong><span id="mode-badge">网页练习</span></div><div id="workspace-content"></div></div>
</div>
<div id="feedback" role="status" aria-live="polite"></div>
<div class="lesson-footer"><button id="previous" class="quiet">← 上一步</button><span id="completion"></span><button id="next" class="primary" disabled>下一步 →</button></div>
<div class="real-tip"><strong>在真实程序中</strong><span id="real-tip"></span></div>
</section>
</div>
<footer>所有资料均为虚构示例。真实资料、模型账号和程序设置不会被本教程更改。</footer>

  const walker=document.createTreeWalker(document.body,4);let node;

 }
 function apply(){if(document.documentElement)document.documentElement.lang=language==='en'?'en':'zh-CN';if(originalTitle)document.title=t(originalTitle);for(const [node,value] of originalNodes)if(node.isConnected)node.data=t(value);for(const [element,name,value] of originalAttributes)if(element.isConnected)element.setAttribute(name,t(value));}

 globalThis.StellarI18n={t,ui,message,count:(n,zh,one,many)=>n+' '+(language==='en'?(n===1?one:many):zh),setLanguage,apply,get language(){return language},get locale(){return language==='en'?'en-US':'zh-CN'}};

 {title:'空格分词，准确找回',short:'组合搜索',sub:'全部包含，顺序不限',instruction:'在搜索框输入「科学月刊 6月」，只找同时包含两个词的资料。',hint:'也可以输入「6月 科学月刊」。连续空格和全角空格都可以。',tip:'左侧「搜索知识库」支持多个关键词，按全部包含、顺序不限匹配；关键词可分布在标题、正文、摘要和标签等字段中。'},

function showSearch(){

 const rows=[{id:'june',title:renamedTitle,text:t(sampleSummary)},{id:'may',title:t('科学月刊 · 2026年5月'),text:t('五月虚构示例，主题为气候与海洋。')},{id:'reading',title:t('6月读书笔记'),text:t('虚构阅读计划与个人笔记。')}];
 function search(){const query=$('#practice-search').value;const keywords=query.toLocaleLowerCase().trim().split(/\s+/).filter(Boolean);const results=rows.filter(row=>keywords.every(word=>(row.title+' '+row.text).toLocaleLowerCase().includes(word)));$('#search-count').textContent=StellarI18n.count(results.length,'份示例资料 · 全部关键词都要匹配','sample item · every keyword must match','sample items · every keyword must match');$('#search-results').innerHTML=results.length?results.map(row=>`<button class="result" data-result="${row.id}"><strong>${escapeHtml(row.title)}</strong><p>${escapeHtml(row.text)}</p></button>`).join(''):t('<p class="small">没有同时包含全部关键词的资料，试试调整搜索词。</p>');$('#search-results').querySelectorAll('[data-result]').forEach(button=>button.onclick=()=>{if(button.dataset.result==='june')showDetail();else $('#feedback').textContent=t('这份资料是用于对照的虚构示例。')});if(new Set(keywords).size>=2&&results.length===1&&results[0].id==='june')complete(1,t('✓ 已用组合关键词找到六月月刊。调换两个词的顺序，结果仍然相同。'));}
 $('#practice-search').oninput=search;search();$('#practice-search').focus();
}
function showDetail(){
 ensureFile();$('#workspace-content').innerHTML=ui`<button id="practice-title" class="title-button" title="点击修改标题">${escapeHtml(renamedTitle)} <span aria-hidden="true">✎</span></button><p class="small">科学与技术 · 已整理 · 虚构示例</p><div><span class="tag">月球探索</span><span class="tag">6月</span><span class="tag">前部概览</span></div><div class="row"><button class="secondary" id="practice-open-pdf">浏览器打开 PDF ↗</button><button class="secondary" id="practice-default">默认程序打开</button></div><div class="preview-box"><h4>资料摘要</h4><p>【PDF 前 5 页概览】${t(sampleSummary)}</p></div><p class="small">示例原文件：练习月刊_2026年6月.pdf</p>`;
 $('#practice-title').onclick=editTitle;$('#practice-open-pdf').onclick=()=>{if(!pdfUrl)pdfUrl=URL.createObjectURL(new Blob([makePdf()],{type:'application/pdf'}));window.open(pdfUrl,'_blank','noopener');complete(3,t('✓ 示例 PDF 已在新标签页打开。关掉它即可继续练习。'));};$('#practice-default').onclick=()=>{$('#feedback').textContent=t('真实程序会调用系统默认 PDF 应用。教程只演示入口；请点击「浏览器打开 PDF」完成练习。');};

function editTitle(){
 const parent=$('#practice-title').parentElement;const form=document.createElement('form');form.id='practice-title-form';form.innerHTML=ui`<label class="search-label" for="practice-title-input">修改示例标题</label><input id="practice-title-input" maxlength="300" required value="${escapeHtml(renamedTitle)}"><div class="row"><button class="primary" type="submit">保存标题</button><button class="secondary" type="button" id="practice-title-cancel">取消</button></div>`;$('#practice-title').replaceWith(form);$('#practice-title-input').focus();$('#practice-title-input').select();const cancel=()=>showDetail();$('#practice-title-cancel').onclick=cancel;$('#practice-title-input').onkeydown=event=>{if(event.key==='Escape'){event.preventDefault();cancel();}};form.onsubmit=event=>{event.preventDefault();const title=$('#practice-title-input').value.trim();if(!title){$('#feedback').textContent=t('标题不能为空。');return;}const changed=title!==renamedTitle;renamedTitle=title;ensureFile();showDetail();if(changed)complete(2,t('✓ 标题已修改。示例摘要和 PDF 内容保持不变。'));else $('#feedback').textContent=t('试试换一个不同的名字，再保存。');};
}
function showSettings(){
 $('#workspace-content').innerHTML=ui`<div class="settings"><p class="settings-label">模型与设置</p><h3>使用方式</h3><p>桌面窗口与网页模式共用知识库和对话记录，程序记住上次选择。</p><button class="secondary" id="practice-mode">${mode==='browser'?t('切到桌面模式'):t('切到网页模式')}</button><div class="preview-box"><strong>练习提示</strong><p>此处只改变练习界面的标记，不会切换你真实程序的窗口。</p></div></div>`;

 $('#workspace-content').innerHTML=t('<div class="settings"><p class="settings-label">导出知识库备份</p><h3>一个 ZIP，带上原件。</h3><p>以下是虚构的备份清单预览，本练习没有下载任何文件。</p><div class="tree">知识库备份.zip\n├── archive.sqlite3  数据库\n├── archive.json     资料清单与摘要\n└── files/\n    └── 示例资料编号   PDF 原文件内容</div><p class="small">归档原件可能使用资料编号命名。通过程序下载原文件时，会恢复原文件名。</p></div>');complete(5,t('✓ 备份包括原文件。以后可通过「导入知识库备份」合并恢复资料。'));

function reset(){current=0;done=new Set();imported=false;renamedTitle=t('科学月刊 · 2026年6月');mode='browser';$('#mode-badge').textContent=t('网页练习');$('#recent-file').hidden=true;go(0);}
function makePdf(){
 const stream='BT /F1 22 Tf 44 730 Td (Stellar Secretary - Tutorial PDF) Tj 0 -40 Td /F1 13 Tf (Fictional science magazine, June 2026.) Tj 0 -28 Td (Topics: Moon exploration, robots and clean energy.) Tj 0 -42 Td (This is a practice file. No private documents are used.) Tj ET';
 const objects=['<< /Type /Catalog /Pages 2 0 R >>','<< /Type /Pages /Kids [3 0 R] /Count 1 >>','<< /Type /Page /Parent 2 0 R /MediaBox [0 0 612 792] /Resources << /Font << /F1 4 0 R >> >> /Contents 5 0 R >>','<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>',`<< /Length ${stream.length} >>\nstream\n${stream}\nendstream`];let pdf='%PDF-1.4\n';const offsets=[0];objects.forEach((object,index)=>{offsets.push(pdf.length);pdf+=`${index+1} 0 obj\n${object}\nendobj\n`;});const xref=pdf.length;pdf+=`xref\n0 ${objects.length+1}\n0000000000 65535 f \n`+offsets.slice(1).map(offset=>String(offset).padStart(10,'0')+' 00000 n \n').join('')+`trailer\n<< /Size ${objects.length+1} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF\n`;return pdf;
}
