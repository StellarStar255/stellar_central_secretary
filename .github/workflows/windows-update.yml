name: Windows Update Transaction
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  update:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install "websocket-client>=1.8,<2"
      - name: Repeat actual Windows Chrome proxy fixture
        shell: pwsh
        run: |
          $chrome = python -c "from secretary.browser_reader import chrome_executable; print(chrome_executable())"
          (Get-Item -LiteralPath $chrome).VersionInfo.ProductVersion
          1..3 | ForEach-Object {
            python scripts/check_browser_proxy.py
            if ($LASTEXITCODE) { throw "Chrome fixture iteration $_ failed" }
          }
