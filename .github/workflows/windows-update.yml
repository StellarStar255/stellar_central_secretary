name: Windows Update Transaction
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  update:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt -r packaging/requirements-build.txt
      - run: python -m unittest discover -s tests -v
      - run: pyinstaller packaging/stellar-secretary.spec --noconfirm
      - name: Build real installer
        shell: pwsh
        run: |
          $version = python -c "from secretary import __version__; print(__version__)"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" packaging\windows_installer.iss
          if ($LASTEXITCODE) { throw "Installer build failed" }
      - run: python packaging/smoke_windows_update.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-update-logs
          path: test-results/windows-update/
          if-no-files-found: ignore
