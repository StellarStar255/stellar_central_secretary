name: Linux packages
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux desktop test tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb dbus-x11 openbox stalonetray xdotool wmctrl x11-utils fonts-noto-cjk libxcb-cursor0 libxkbcommon-x11-0 libegl1 libopengl0 policykit-1
      - run: python -m pip install -r requirements.txt -r packaging/requirements-build.txt "websocket-client>=1.8,<2"
      - name: Native Linux source window and tray
        run: dbus-run-session -- xvfb-run -a python packaging/smoke_linux_desktop.py --source
      - run: python -m unittest discover -s tests -v
      - run: node tests/test_chat_ui.cjs
      - name: Build and test Linux x64 packages
        run: PYTHON=python bash packaging/build_linux.sh
      - name: Verify installed Debian package
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y desktop-file-utils
          sudo apt-get install -y ./dist/*-linux-x64.deb
          test -x /usr/bin/stellar-secretary
          desktop-file-validate /usr/share/applications/stellar-secretary.desktop
          SECRETARY_SMOKE_BINARY=/usr/bin/stellar-secretary python packaging/smoke.py
      - name: Native installed Linux window and tray
        run: dbus-run-session -- xvfb-run -a python packaging/smoke_linux_desktop.py --binary /usr/bin/stellar-secretary
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-desktop-screenshots
          path: test-results/linux-desktop-*.png
          if-no-files-found: ignore
      - name: Verify portable package
        run: |
          mkdir "$RUNNER_TEMP/portable"
          tar -xzf dist/*-linux-x64.tar.gz -C "$RUNNER_TEMP/portable"
          SECRETARY_SMOKE_BINARY="$RUNNER_TEMP/portable/Stellar-Secretary/start.sh" python packaging/smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: installer-linux-x64
          path: |
            dist/*-linux-x64.deb
            dist/*-linux-x64.tar.gz
          if-no-files-found: error
