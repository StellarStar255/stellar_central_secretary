name: Build & Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            arch: arm64
          - os: windows-latest
            arch: x64
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify version
        shell: bash
        run: |
          VERSION=$(python -c 'from secretary import __version__; print(__version__)')
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF#refs/tags/v}" != "$VERSION" ]]; then exit 1; fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - run: python -m pip install -r requirements.txt -r packaging/requirements-build.txt
      - run: python -m unittest discover -s tests -v
      - run: node tests/test_chat_ui.cjs
      - name: Windows desktop test tools
        if: runner.os == 'Windows'
        run: |
          python -m pip install "websocket-client>=1.8,<2"
          python -m playwright install chromium
      - name: Text and command archive UI
        if: runner.os == 'Windows'
        run: python scripts/check_text_archive_ui.py
      - name: Windows native source UI
        if: runner.os == 'Windows'
        run: python packaging/smoke_windows_desktop.py --source
      - run: pyinstaller packaging/stellar-secretary.spec --noconfirm
      - run: python packaging/smoke.py
      - name: Windows native frozen UI
        if: runner.os == 'Windows'
        run: python packaging/smoke_windows_desktop.py
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Windows'
        with:
          name: windows-desktop-screenshots
          path: test-results/windows-desktop-*.png
          if-no-files-found: ignore
      - name: Import signing certificate
        if: runner.os == 'macOS' && env.MACOS_CERT_P12 != ''
        shell: bash
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PW="$(uuidgen)"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PW" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
      - name: macOS DMG
        if: runner.os == 'macOS'
        shell: bash
        run: bash packaging/macos_sign_notarize.sh "dist/Stellar Secretary.app" "dist/Stellar-Secretary-$VERSION-macos-${{ matrix.arch }}.dmg"
      - name: Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$env:VERSION" packaging\windows_installer.iss
          if ($LASTEXITCODE) { throw "Installer build failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*-setup.exe
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: installer-*
          merge-multiple: true
      - name: Tutorial downloads
        run: cp docs/demo.gif docs/demo-en.gif docs/tutorial.html artifacts/
      - name: Checksums
        working-directory: artifacts
        run: sha256sum -- * > SHA256SUMS.txt
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ secrets.MACOS_SIGN_IDENTITY != '' && secrets.APPLE_ID != '' }}
        shell: bash
        run: |
          ARGS=()
          if [[ "$SIGNED" != true ]]; then ARGS+=(--draft); fi
          gh release create "$GITHUB_REF_NAME" artifacts/* --title "$GITHUB_REF_NAME" --notes-file "docs/releases/$GITHUB_REF_NAME.md" "${ARGS[@]}"
