name: Windows In-App Video
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  video:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt -r packaging/requirements-build.txt "websocket-client>=1.8,<2"
      - run: python -m playwright install chromium
      - run: python -m unittest discover -s tests -v
      - run: python scripts/check_video_title_ui.py
      - run: python scripts/check_recovery_ui.py
      - run: python scripts/check_pdf_selection_ui.py
      - run: python scripts/check_pdf_scope_ui.py
      - run: python scripts/check_storage_ui.py
      - run: python scripts/check_backup_settings_ui.py
      - run: python scripts/check_upload_resume_ui.py
      - run: python packaging/smoke_windows_desktop.py --source
      - run: pyinstaller packaging/stellar-secretary.spec --noconfirm
      - run: python packaging/smoke_windows_desktop.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-video-screenshots
          path: test-results/windows-desktop-*.png
          if-no-files-found: ignore
